[project]
name = "python-analytics"
version = "0.1.0"
description = "Python Analytics Playground — аналитический портфолио-проект"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python_analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=python_analytics --cov-report=term-missing --cov-fail-under=60"
